<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>The Koshak – Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 pb-20">

  <!-- Top bar -->
  <header class="flex items-center justify-between px-4 py-3 bg-white border-b border-slate-200">
    <h1 class="text-lg font-bold text-slate-800">The Koshak</h1>
    <button id="logoutBtn" class="text-xs text-slate-400 hover:text-red-500">Logout</button>
  </header>

  <main class="p-4">

    <!-- Alerts -->
    <div id="alerts"></div>

    <!-- Stats cards -->
    <div class="grid grid-cols-1 gap-4 mb-8" id="statsSection">
      <div class="card bg-blue-600 text-white shadow-xl">
        <div class="card-body p-6">
          <h2 class="card-title text-sm opacity-80">Total Inventory</h2>
          <p class="text-4xl font-bold"><span id="netStock">—</span> <span class="text-lg font-normal opacity-80">Meters</span></p>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div class="stat bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
          <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Total Inward</div>
          <div class="text-green-500 text-2xl font-bold mt-1" id="totalInward">—</div>
        </div>
        <div class="stat bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
          <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Total Outward</div>
          <div class="text-red-500 text-2xl font-bold mt-1" id="totalOutward">—</div>
        </div>
      </div>
    </div>

    <!-- Search + Export -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
      <div class="flex gap-2 w-full md:w-2/3">
        <input id="searchInput" type="text" placeholder="Search by Fabric or Shade Code…"
               class="input input-bordered w-full focus:border-blue-500 text-sm" />
        <button id="searchBtn" class="btn btn-primary btn-sm h-12 px-6">Search</button>
        <button id="clearBtn" class="btn btn-ghost btn-sm h-12 text-slate-500 hidden">Clear</button>
      </div>
      <a id="exportCsvBtn" href="#"
         class="btn btn-outline btn-success w-full md:w-auto btn-sm h-12 flex items-center justify-center gap-2">
        Export CSV
      </a>
    </div>

    <!-- Stock list -->
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold text-slate-700">Live Stock by Profile</h3>
      <span class="badge badge-outline text-xs bg-white" id="itemCount">0 Items</span>
    </div>
    <div class="space-y-3" id="stockList"></div>

  </main>

  <!-- Bottom nav -->
  <div class="btm-nav border-t border-slate-200">
    <a href="index.html" class="active">
      <span class="btm-nav-label text-xs">Home</span>
    </a>
    <a href="inventory.html">
      <span class="btm-nav-label text-xs">Inventory</span>
    </a>
    <a href="https://wa.me/your_bot_number" target="_blank" class="bg-green-500 text-white">
      <span class="btm-nav-label text-xs font-bold">Open Bot</span>
    </a>
  </div>

  <script src="config.js?v=20260601"></script>
  <script src="auth.js?v=20260601"></script>
  <script src="app.js?v=20260601"></script>
</body>
</html>
