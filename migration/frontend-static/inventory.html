<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>The Koshak – Ledger</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 pb-20">

  <header class="flex items-center justify-between px-4 py-3 bg-white border-b border-slate-200">
    <h1 class="text-lg font-bold text-slate-800">Ledger History</h1>
    <button id="logoutBtn" class="text-xs text-slate-400 hover:text-red-500">Logout</button>
  </header>

  <main class="p-4">
    <p class="text-sm text-slate-500 mb-4">Recent inventory movements</p>
    <div class="space-y-3" id="ledgerList">
      <div class="text-center py-10 text-slate-400 text-sm">Loading…</div>
    </div>
  </main>

  <!-- Bottom nav -->
  <div class="btm-nav border-t border-slate-200">
    <a href="index.html">
      <span class="btm-nav-label text-xs">Home</span>
    </a>
    <a href="inventory.html" class="active">
      <span class="btm-nav-label text-xs">Inventory</span>
    </a>
    <a href="https://wa.me/your_bot_number" target="_blank" class="bg-green-500 text-white">
      <span class="btm-nav-label text-xs font-bold">Open Bot</span>
    </a>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    if (!Auth.isLoggedIn()) window.location.replace("login.html");

    document.getElementById("logoutBtn").addEventListener("click", () => Auth.logout());

    function badge(type) {
      if (type === "INWARD")  return `<div class="badge badge-sm bg-green-100 text-green-700 border-none font-bold text-[9px] px-2 py-2 mt-1">INWARD</div>`;
      if (type === "RETURN")  return `<div class="badge badge-sm bg-blue-100 text-blue-700 border-none font-bold text-[9px] px-2 py-2 mt-1">RETURN</div>`;
      return `<div class="badge badge-sm bg-red-100 text-red-700 border-none font-bold text-[9px] px-2 py-2 mt-1">OUTWARD</div>`;
    }

    function formatDate(iso) {
      if (!iso) return "Unknown Date";
      return new Date(iso).toLocaleString("en-IN", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    async function loadLedger() {
      const resp = await Auth.apiFetch("/api/data/ledger");
      if (!resp) return;
      const items = await resp.json();
      const el = document.getElementById("ledgerList");
      if (!items.length) {
        el.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm">No ledger records found.</div>`;
        return;
      }
      el.innerHTML = items.map(item => `
        <div class="card bg-white shadow-sm border border-slate-100 rounded-xl">
          <div class="card-body p-4 flex flex-row items-center justify-between">
            <div>
              <h2 class="card-title text-sm font-bold text-slate-800">${item.fabric || "Unknown Item"}</h2>
              <div class="text-[10px] text-slate-400 mt-1 font-medium">${formatDate(item.created_at)}</div>
              ${item.shade_code ? `<div class="text-[9px] text-slate-400 mt-1">Shade: ${item.shade_code}</div>` : ""}
            </div>
            <div class="text-right">
              <div class="font-bold text-lg text-slate-700">
                ${item.meters} <span class="text-[10px] font-normal text-slate-400">Meters</span>
              </div>
              ${item.thaans ? `<div class="font-bold text-sm text-slate-600">${item.thaans} <span class="text-[9px] font-normal text-slate-400">Thaans</span></div>` : ""}
              ${badge(item.transaction_type)}
            </div>
          </div>
        </div>`).join("");
    }

    loadLedger();
  </script>
</body>
</html>
