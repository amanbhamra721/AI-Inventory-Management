<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Koshak ERP - Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-200 text-base-content min-h-screen">
  <div class="lg:grid lg:grid-cols-[260px,1fr] min-h-screen">
    <aside class="hidden lg:flex flex-col bg-base-100 border-r border-base-300">
      <div class="px-6 py-6 border-b border-base-300">
        <h1 class="text-xl font-bold tracking-tight">The Koshak</h1>
        <p class="text-sm text-base-content/60 mt-1">Inventory App</p>
      </div>
      <ul class="menu p-4 gap-2">
        <li><a href="index.html" class="rounded-xl">Dashboard</a></li>
        <li><a href="inventory.html" class="rounded-xl active font-semibold">Inventory</a></li>
      </ul>
      <div class="mt-auto p-4 border-t border-base-300">
        <button id="logoutBtnDesktop" class="btn btn-outline btn-sm w-full">Logout</button>
      </div>
    </aside>

    <div class="flex flex-col min-h-screen max-w-screen-md lg:max-w-none mx-auto w-full">
      <header class="sticky top-0 z-30 bg-base-100/95 backdrop-blur border-b border-base-300 pt-[max(env(safe-area-inset-top),0px)]">
        <div class="navbar px-4 h-16">
          <div class="flex-1">
            <h2 class="text-lg font-semibold">The Koshak</h2>
          </div>
          <div class="flex-none gap-2">
            <button id="logoutBtnMobile" class="btn btn-ghost btn-sm">Logout</button>
          </div>
        </div>
      </header>

      <main class="flex-1 p-4 sm:p-6 pb-28 lg:pb-6 [padding-bottom:calc(env(safe-area-inset-bottom)+6rem)] lg:[padding-bottom:1.5rem]">
        <div class="bg-base-100 rounded-2xl shadow-sm border border-base-300 p-4 sm:p-6">
          <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-6">
            <div>
              <h1 class="text-xl sm:text-2xl font-bold">Master Inventory</h1>
              <p class="text-sm text-base-content/70">Complete inward/outward transaction ledger.</p>
            </div>

            <div class="flex flex-col sm:flex-row gap-2 w-full lg:w-auto">
              <label class="input input-bordered flex items-center gap-2 w-full sm:w-72">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 100-15 7.5 7.5 0 000 15z" />
                </svg>
                <input type="text" id="searchInput" placeholder="Search fabric, shade, bale..." class="grow" />
              </label>
              <select id="brandFilter" class="select select-bordered w-full sm:w-44">
                <option value="">All Brands</option>
              </select>
              <input type="text" id="partyFilter" class="input input-bordered w-full sm:w-56" placeholder="Party name" />
              <select id="typeFilter" class="select select-bordered w-full sm:w-44">
                <option value="">All Types</option>
                <option value="INWARD">Inward</option>
                <option value="OUTWARD">Outward</option>
              </select>
              <button id="applyBtn" class="btn btn-primary rounded-xl">Apply</button>
            </div>
          </div>

          <div class="overflow-x-auto w-full">
            <table class="table table-zebra w-full">
              <thead>
                <tr>
                  <th>Fabric Name</th>
                  <th>Brand</th>
                  <th>Party</th>
                  <th>Reference</th>
                  <th>Shade Code</th>
                  <th>Bale Number</th>
                  <th>Inward/Outward</th>
                  <th class="text-right">Meters</th>
                  <th class="text-right">Thaans</th>
                  <th>Date</th>
                  <th class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="inventoryBody">
                <tr><td colspan="11" class="text-center py-6"><span class="loading loading-spinner loading-sm"></span></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>

      <nav class="fixed lg:hidden bottom-0 left-0 right-0 z-40 bg-base-100 border-t border-base-300 pb-[max(env(safe-area-inset-bottom),0px)]">
        <div class="grid grid-cols-2 gap-1 px-2 py-2 text-xs">
          <a href="index.html" class="btn btn-ghost btn-sm h-12 rounded-xl">Home</a>
          <a href="inventory.html" class="btn btn-ghost btn-sm h-12 rounded-xl btn-active">Inventory</a>
        </div>
      </nav>
    </div>
  </div>

  <dialog id="editModal" class="modal">
    <div class="modal-box max-w-md">
      <h3 class="font-bold text-lg mb-3">Edit Inventory Row</h3>
      <form id="editForm" class="space-y-2">
        <input type="hidden" id="editEntryId" />
        <input class="input input-bordered input-sm w-full" id="editFabric" placeholder="Fabric" required />
        <input class="input input-bordered input-sm w-full" id="editShade" placeholder="Shade Code" />
        <input class="input input-bordered input-sm w-full" id="editBale" placeholder="Bale Number" />
        <select class="select select-bordered select-sm w-full" id="editType">
          <option value="INWARD">INWARD</option>
          <option value="OUTWARD">OUTWARD</option>
        </select>
        <input class="input input-bordered input-sm w-full" type="number" step="0.01" id="editMeters" placeholder="Meters" required />
        <input class="input input-bordered input-sm w-full" type="number" id="editThaans" placeholder="Thaans" required />
        <input class="input input-bordered input-sm w-full" type="number" step="0.01" id="editUnitPrice" placeholder="Unit Price" />
        <p id="editError" class="text-error text-xs min-h-4"></p>
        <div class="modal-action mt-2">
          <button type="button" class="btn btn-ghost btn-sm" id="cancelEditBtn">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
        </div>
      </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <script src="config.js?v=20260602"></script>
  <script src="auth.js?v=20260602"></script>
  <script>
    if (!Auth.isLoggedIn()) window.location.replace("login.html");
    document.getElementById("logoutBtnDesktop").addEventListener("click", () => Auth.logout());
    document.getElementById("logoutBtnMobile").addEventListener("click", () => Auth.logout());

    let allRows = [];

    function fmtDate(iso) {
      if (!iso) return "-";
      return new Date(iso).toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function renderRows(rows) {
      const body = document.getElementById("inventoryBody");
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="11" class="text-center text-base-content/60 py-6">No inventory records found.</td></tr>';
        return;
      }
      body.innerHTML = rows.map((item) => `
        <tr>
          <td class="font-medium">${item.fabric || "N/A"}</td>
          <td>${item.brand_name || "BR"}</td>
          <td>${item.party_name || "-"}</td>
          <td>${item.reference_no || "-"}</td>
          <td>${item.shade_code || "N/A"}</td>
          <td>${item.bale_no || "-"}</td>
          <td>${item.transaction_type === "INWARD" ? '<span class="badge badge-success">Inward</span>' : '<span class="badge badge-error">Outward</span>'}</td>
          <td class="text-right font-semibold">${Number(item.meters || 0).toFixed(2)}</td>
          <td class="text-right font-semibold">${Number(item.thaans || 0)}</td>
          <td>${fmtDate(item.created_at)}</td>
          <td class="text-center">
            <button class="btn btn-ghost btn-xs rounded-lg" data-edit-id="${item.id}" title="Edit" aria-label="Edit row">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
              </svg>
            </button>
          </td>
        </tr>
      `).join("");

      body.querySelectorAll("[data-edit-id]").forEach((btn) => {
        btn.addEventListener("click", () => openEditModal(Number(btn.getAttribute("data-edit-id"))));
      });
    }

    function openEditModal(entryId) {
      const row = allRows.find((r) => Number(r.id) === Number(entryId));
      if (!row) return;
      document.getElementById("editEntryId").value = row.id;
      document.getElementById("editFabric").value = row.fabric || "";
      document.getElementById("editShade").value = row.shade_code || "";
      document.getElementById("editBale").value = row.bale_no || "";
      document.getElementById("editType").value = row.transaction_type || "INWARD";
      document.getElementById("editMeters").value = Number(row.meters || 0);
      document.getElementById("editThaans").value = Number(row.thaans || 0);
      document.getElementById("editUnitPrice").value = Number(row.unit_price || 0);
      document.getElementById("editError").textContent = "";
      document.getElementById("editModal").showModal();
    }

    async function saveEdit(e) {
      e.preventDefault();
      const payload = {
        entry_id: Number(document.getElementById("editEntryId").value),
        fabric: document.getElementById("editFabric").value.trim(),
        shade_code: document.getElementById("editShade").value.trim() || null,
        bale_no: document.getElementById("editBale").value.trim() || null,
        transaction_type: document.getElementById("editType").value,
        meters: Number(document.getElementById("editMeters").value || 0),
        thaans: Number(document.getElementById("editThaans").value || 0),
        unit_price: Number(document.getElementById("editUnitPrice").value || 0),
      };

      const errEl = document.getElementById("editError");
      errEl.textContent = "";
      const resp = await Auth.apiFetch("/api/data/ledger/edit", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!resp) return;
      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        errEl.textContent = data.detail || "Failed to save changes.";
        return;
      }
      document.getElementById("editModal").close();
      await loadLedger();
    }

    function rebuildBrandFilterOptions(rows) {
      const select = document.getElementById("brandFilter");
      const selected = select.value;
      const brands = [...new Set(rows.map((r) => (r.brand_name || "BR").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));

      select.innerHTML = '<option value="">All Brands</option>' + brands.map((brand) => `<option value="${brand}">${brand}</option>`).join("");
      if (selected && brands.includes(selected)) {
        select.value = selected;
      }
    }

    function applyFilter() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const t = document.getElementById("typeFilter").value;
      const b = document.getElementById("brandFilter").value;
      const p = document.getElementById("partyFilter").value.trim().toLowerCase();
      const filtered = allRows.filter((r) => {
        const text = `${r.fabric || ""} ${r.brand_name || ""} ${r.party_name || ""} ${r.reference_no || ""} ${r.shade_code || ""} ${r.bale_no || ""}`.toLowerCase();
        const bySearch = !q || text.includes(q);
        const byType = !t || r.transaction_type === t;
        const byBrand = !b || (r.brand_name || "BR") === b;
        const byParty = !p || (r.party_name || "").toLowerCase().includes(p);
        return bySearch && byType && byBrand && byParty;
      });
      renderRows(filtered);
    }

    async function loadLedger() {
      const resp = await Auth.apiFetch("/api/data/ledger");
      if (!resp) return;
      allRows = await resp.json();
      rebuildBrandFilterOptions(allRows);
      applyFilter();
    }

    document.getElementById("applyBtn").addEventListener("click", applyFilter);
    document.getElementById("brandFilter").addEventListener("change", applyFilter);
    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") applyFilter();
    });
    document.getElementById("partyFilter").addEventListener("keydown", (e) => {
      if (e.key === "Enter") applyFilter();
    });
    document.getElementById("cancelEditBtn").addEventListener("click", () => document.getElementById("editModal").close());
    document.getElementById("editForm").addEventListener("submit", saveEdit);

    loadLedger();
  </script>
</body>
</html>
