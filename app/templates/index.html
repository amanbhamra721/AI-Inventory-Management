{% extends "base.html" %}

{% block content %}
<div class="mb-5">
    <h1 class="text-2xl font-bold text-slate-800">Dashboard</h1>
    <p class="text-sm text-slate-500">Real-time inventory overview</p>
</div>

<div class="grid grid-cols-1 gap-4">
    <!-- Current Stock Card -->
    <div class="card bg-blue-600 text-white shadow-xl">
        <div class="card-body p-6">
            <h2 class="card-title text-sm opacity-80">Current Stock</h2>
            <p class="text-4xl font-bold">{{ stats.net_stock | default(0, true) }} <span class="text-lg font-normal opacity-80">Meters</span></p>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <!-- Inward Stat -->
        <div class="stat bg-white rounded-2xl shadow-sm border border-slate-100 p-4 flex flex-col justify-center">
            <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Total Inward</div>
            <div class="text-green-500 text-2xl font-bold mt-1">{{ stats.inward | default(0, true) }}</div>
        </div>
        <!-- Outward Stat -->
        <div class="stat bg-white rounded-2xl shadow-sm border border-slate-100 p-4 flex flex-col justify-center">
            <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Total Outward</div>
            <div class="text-red-500 text-2xl font-bold mt-1">{{ stats.outward | default(0, true) }}</div>
        </div>
    </div>
</div>
{% endblock %}
