<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Koshak - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-sm bg-white shadow-xl">
        <div class="card-body">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-blue-600">The Koshak</h1>
                <p class="text-slate-400 text-sm">Inventory Management System</p>
            </div>
            
            <form action="/login" method="POST" class="space-y-4">
                <div class="form-control">
                    <label class="label"><span class="label-text font-semibold">Phone Number</span></label>
                    <input type="text" name="phone" placeholder="phone no." class="input input-bordered focus:border-blue-500" required />
                </div>
                
                <div class="form-control">
                    <label class="label"><span class="label-text font-semibold">Password</span></label>
                    <input type="password" name="password" placeholder="••••••••" class="input input-bordered focus:border-blue-500" required />
                </div>

                {% if error %}
                <p class="text-error text-xs text-center">{{ error }}</p>
                {% endif %}

                <button type="submit" class="btn btn-primary w-full mt-4">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
